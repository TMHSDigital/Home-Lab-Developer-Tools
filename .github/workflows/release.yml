name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release only when something that ships (MCP server code, skills, rules,
  # plugin manifest) changed since the last tag. Docs, tests and CI changes
  # alone do not publish a new version; they go out with the next release.
  gate:
    name: Check for shipped changes
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with the last tag
        id: paths
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shipped=$(git diff --name-only "$last_tag"..HEAD \
            | grep -E '^(mcp-server/|skills/|rules/|\.cursor-plugin/)' \
            | grep -vE '(^|/)__tests__/|\.test\.ts$' || true)
          if [ -n "$shipped" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Shipped changes since $last_tag:"
            printf '%s\n' "$shipped"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No shipped changes since $last_tag; skipping release."
          fi

  # The same checks as CI, so a commit that fails them is never tagged.
  test:
    name: Build and test before release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Build and test the MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run structure tests
        run: |
          pip install -r requirements-test.txt
          pytest tests/ --tb=short

  version-and-release:
    name: Bump version, tag, and release
    needs: [gate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          version=$(python3 -c "import json; print(json.load(open('.cursor-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from commits
        id: bump
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            commits=$(git log --oneline --format="%s")
          else
            commits=$(git log "$last_tag"..HEAD --oneline --format="%s")
          fi

          bump="patch"
          if echo "$commits" | grep -qiE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE"; then
            bump="major"
          elif echo "$commits" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
            bump="minor"
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: new
        run: |
          current="${{ steps.current.outputs.version }}"
          bump="${{ steps.bump.outputs.bump }}"
          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.new.outputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version files
        if: steps.check.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
          OLD_VERSION: ${{ steps.current.outputs.version }}
        run: |
          python3 -c "
          import json, os

          new_version = os.environ['NEW_VERSION']
          old_version = os.environ['OLD_VERSION']

          path = '.cursor-plugin/plugin.json'
          with open(path) as f:
              data = json.load(f)
          data['version'] = new_version
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          readme = 'README.md'
          with open(readme) as f:
              content = f.read()
          content = content.replace(
              f'version-{old_version}-',
              f'version-{new_version}-'
          )
          with open(readme, 'w') as f:
              f.write(content)

          # Keep the npm package version in lockstep with the plugin version
          for path in ('mcp-server/package.json', 'mcp-server/package-lock.json'):
              with open(path) as f:
                  data = json.load(f)
              data['version'] = new_version
              if 'packages' in data and '' in data['packages']:
                  data['packages']['']['version'] = new_version
              with open(path, 'w') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write('\n')

          import re
          index = 'mcp-server/src/index.ts'
          with open(index) as f:
              content = f.read()
          content = re.sub(r'version: \x22[0-9][^\x22]*\x22', f'version: \x22{new_version}\x22', content, count=1)
          with open(index, 'w') as f:
              f.write(content)
          "

      - name: Sync release docs
        if: steps.check.outputs.skip == 'false'
        uses: TMHSDigital/Developer-Tools-Directory/.github/actions/release-doc-sync@f10dd5e060ffcd30e44b950c09af970f96579ff8 # v1.20.0
        with:
          plugin-version: ${{ steps.new.outputs.version }}
          previous-version: ${{ steps.current.outputs.version }}

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ steps.new.outputs.version }} [skip ci]"
          git tag "v${{ steps.new.outputs.version }}"
          # --atomic: never push the tag unless main also moves, so a race
          # with another push cannot leave an orphaned tag behind
          git push --atomic origin main "refs/tags/v${{ steps.new.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.new.outputs.version }}" \
            --title "v${{ steps.new.outputs.version }}" \
            --generate-notes

      # npm trusted publishing (OIDC) is bound to publish.yml, so publishing
      # must run there. Releases created with GITHUB_TOKEN do not trigger
      # other workflows, but workflow_dispatch does.
      - name: Dispatch npm publish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --ref main \
            -f tag="v${{ steps.new.outputs.version }}"
