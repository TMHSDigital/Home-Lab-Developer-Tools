---
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "rules/**"
      - "mcp-tools.json"
      - "site.json"
      - ".cursor-plugin/plugin.json"
      - "assets/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: TMHSDigital/Developer-Tools-Directory
          # Pinned: this job can deploy Pages. v1.20.0 plus a Jinja2 floor bump.
          ref: 2c7a7fec926758076fb0af2a2252a6566c0663ad
          path: _template
          sparse-checkout: site-template

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _template/site-template/requirements.txt

      - name: Build site
        run: python _template/site-template/build_site.py --repo-root . --out docs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
